[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rec-lab"
version = "0.1.0"
description = "Hands-on search, recommendation, and advertising model experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "torch>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["models"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["models*"]
exclude = ["outputs*"]
